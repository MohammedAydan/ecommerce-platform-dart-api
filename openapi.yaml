openapi: 3.1.0
info:
  title: Ecommerce Platform API
  version: 1.0.0
  description: Machine-generated contract from the verified Next.js route inventory.
servers:
  - url: https://ec-swart.vercel.app
    description: Production deployment
tags:
  - name: generated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    betterAuthCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    ApiData:
      description: Backend response data; endpoint-specific typed Dart decoders are preferred.
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: boolean
    ApiError:
      type: object
      properties:
        success: {type: boolean, const: false}
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            details: {}
          required: [code, message]
    ApiSuccess:
      type: object
      properties:
        success: {type: boolean, const: true}
        data: {$ref: "#/components/schemas/ApiData"}
        meta: {type: object, additionalProperties: true}
        pagination: {type: object, additionalProperties: true}
      required: [success]
